<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Copilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--panel:#fff;--ink:#0a0a0a;--muted:#737373;--line:#e8e8e8;--accent:#4f46e5;--btn:#0a0a0a;--on:#fff;--ok:#16a34a;--warn:#b45309;--bad:#dc2626;--code:#0a0a0a;--soft:rgba(0,0,0,.04);--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#09090b;--panel:#111113;--ink:#fafafa;--muted:#8b8b94;--line:#26262b;--accent:#818cf8;--btn:#fafafa;--on:#09090b;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--code:#050506;--soft:rgba(255,255,255,.05)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1{font-size:28px;font-weight:600;margin:0 0 8px;letter-spacing:-.02em}h2{font-size:15px;font-weight:600;margin:0}h3{font-size:13px;font-weight:500;color:var(--muted);margin:20px 0 8px}
.muted{color:var(--muted)}.ok{color:var(--ok)}code{font-family:var(--mono);font-size:.9em;background:var(--soft);padding:1px 6px;border-radius:5px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:18px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em}#reset{justify-self:end;font-size:13px}
#rail{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:13px}
#rail li{display:flex;align-items:center;gap:8px;color:var(--muted)}
#rail span{width:6px;height:6px;border-radius:50%;background:var(--line);font-size:0}
#rail .done{color:var(--ink)}#rail .done span{background:var(--ink)}
#rail .now{color:var(--ink);font-weight:500}#rail .now span{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
main{max-width:1120px;margin:0 auto;padding:48px 32px 80px;display:grid;gap:32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.narrow{max-width:640px;margin:24px auto 0;width:100%;background:none;border:0;padding:0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.grid,.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.btn{background:var(--btn);color:var(--on);border:1px solid var(--btn);border-radius:10px;padding:10px 20px;font:500 14px var(--sans);cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--soft);opacity:1}
.link{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;padding:0}.link:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{display:grid;gap:4px;justify-items:center;padding:56px 16px;margin:28px 0 16px;border:1px dashed var(--line);border-radius:16px;cursor:pointer;text-align:center;background:var(--panel);transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent)}
.tbl{overflow:auto;max-height:280px;border:1px solid var(--line);border-radius:12px;margin:18px 0;background:var(--panel)}
table{border-collapse:collapse;font-size:13px;width:100%}th,td{padding:8px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-weight:500;color:var(--muted)}tr:last-child td{border:0}
.msg{padding:12px 16px;border-radius:12px;border:1px solid;margin:14px 0;font-size:14px}
.msg.bad{border-color:var(--bad);color:var(--bad)}.msg.warn{border-color:var(--warn);color:var(--warn)}.msg pre{margin-top:8px;color:var(--ink)}
#alert:not(:empty){max-width:1120px;margin:20px auto 0;padding:0 32px}
.stages{list-style:none;padding:0;margin:28px 0;display:grid;gap:10px}
.stages li{display:flex;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stages i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;border:2px solid var(--line)}
.stages .run i{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
.stages .done i{background:var(--ok);border-color:var(--ok)}.stages .fail i{background:var(--bad);border-color:var(--bad)}
.stages small{display:block;color:var(--muted)}
@keyframes spin{to{transform:rotate(1turn)}}
figure{margin:0;text-align:center}figure img{max-width:100%;max-height:420px;object-fit:contain;border-radius:8px}
figcaption{font-size:12px;color:var(--muted);margin-top:8px}.empty{padding:90px 0;color:var(--muted);font-size:14px}
.pager{display:flex;gap:8px;justify-content:center;margin:16px 0}.pager .btn{padding:6px 14px;font-size:13px}
#thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.th{border:1.5px solid transparent;padding:0;border-radius:8px;background:none;cursor:pointer;flex:none;opacity:.55}
.th.on{border-color:var(--accent);opacity:1}.th img{height:52px;display:block;border-radius:6px}
#log{height:340px;overflow:auto;padding-right:4px}
.m{padding:10px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;max-width:92%;overflow-wrap:anywhere;font-size:14px}
.m.user{background:var(--btn);color:var(--on);margin-left:auto;width:fit-content}.m.assistant{background:var(--soft)}
.m pre{white-space:pre-wrap;background:var(--code);color:#e5e5e5;padding:10px;border-radius:8px;margin:6px 0}
#cf{display:flex;gap:8px;margin-top:14px}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0;font:500 14px var(--sans);color:var(--muted);cursor:pointer}
.tabs [aria-selected=true]{color:var(--ink);border-color:var(--ink)}
pre{margin:0;overflow:auto;max-height:420px;font:12.5px/1.6 var(--mono)}
pre.code{background:var(--code);color:#e5e5e5;padding:16px;border-radius:12px}
pre.txt{background:var(--soft);padding:16px;border-radius:12px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:24px 0}
.kv div{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
dt{font-size:12px;color:var(--muted)}dd{margin:4px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.evgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;margin-top:18px}
@media(max-width:860px){.grid,.two{grid-template-columns:1fr}header{grid-template-columns:1fr auto;padding:14px 16px}#rail{grid-column:1/-1;order:3;overflow-x:auto;gap:18px}main{padding:28px 16px 60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><span class="brand">ML Copilot</span><ol id="rail" aria-label="Progress"></ol><button class="link" id="reset">Start over</button></header>
<div id="alert" role="alert"></div>
<main id="main"></main>
<noscript><p style="padding:28px">ML Copilot needs JavaScript.</p></noscript>
<script>
const API = location.pathname.startsWith('/ui') ? '' : 'http://localhost:8000';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/```(?:\w+)?\n?([\s\S]*?)```/g, '<pre>$1</pre>').replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
const flat = c => Array.isArray(c) ? c.map(b => typeof b === 'string' ? b : b.text || '').join('') : String(c ?? '');
const main = $('#main'), STEPS = ['upload', 'analyze', 'explore', 'model'];
let S = JSON.parse(sessionStorage.getItem('mlc') || 'null'), bust = Date.now(), timer;
const save = () => sessionStorage.setItem('mlc', JSON.stringify(S));
const alertMsg = m => $('#alert').innerHTML = m ? `<div class="msg bad">${esc(m)}</div>` : '';

async function api(path, opts = {}, ms) {
  const ctl = new AbortController(), t = ms && setTimeout(() => ctl.abort(), ms);
  try {
    let r;
    try { r = await fetch(API + path, { ...opts, signal: ctl.signal }); }
    catch (e) { throw new Error(e.name === 'AbortError' ? 'The request timed out.' : `Cannot reach the backend at ${API || location.origin}. Is it running?`); }
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail || r.statusText)), { status: r.status });
    return body;
  } finally { clearTimeout(t); }
}
const post = (p, d, ms) => api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }, ms);
const go = step => { S.step = step; save(); render(); };
const imgUrl = (n, sub = '') => `${API}/outputs/${sub ? sub + '/' : ''}${encodeURIComponent(n)}?t=${bust}`;

function render() {
  clearInterval(timer);
  const i = STEPS.indexOf(S.step);
  $('#rail').innerHTML = ['Upload', 'Analyze', 'Explore', 'Model'].map((n, k) =>
    `<li class="${k < i ? 'done' : k === i ? 'now' : ''}"${k === i ? ' aria-current="step"' : ''}><span>${k < i ? '✓' : k + 1}</span>${n}</li>`).join('');
  ({ upload, analyze, explore, model })[S.step]();
}

/* ---------- Upload ---------- */
function parseCSV(t, max = 101) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length && rows.length < max; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); c = ''; rows.push(r); r = []; }
    else c += ch;
  }
  if ((c || r.length) && rows.length < max) { r.push(c); rows.push(r); }
  return rows;
}
function upload() {
  main.innerHTML = `<section class="card narrow"><h1>Upload CSV Dataset</h1>
    <p class="muted">Upload a CSV. The copilot profiles it, draws charts, cleans it, and then helps you train a model.</p>
    <label class="drop" id="drop" tabindex="0"><input type="file" id="file" accept=".csv" hidden><strong>Choose a CSV file</strong><span class="muted">or drop it here</span></label>
    <div id="ustat" role="status"></div><div id="prev"></div>
    <p><button class="btn" id="start" disabled>Start analysis</button></p></section>`;
  const f = $('#file'), d = $('#drop');
  f.onchange = () => onFile(f.files[0]);
  d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
  d.ondragleave = () => d.classList.remove('over');
  d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); onFile(e.dataTransfer.files[0]); };
  d.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f.click(); } };
  $('#start').onclick = () => go('analyze');
}
async function onFile(f) {
  if (!f) return;
  const st = $('#ustat');
  $('#start').disabled = true; $('#prev').innerHTML = '';
  if (!/\.csv$/i.test(f.name)) { st.innerHTML = '<div class="msg bad">Only .csv files are supported.</div>'; return; }
  st.textContent = 'Uploading…';
  try {
    const fd = new FormData(); fd.append('file', f, f.name);
    await api('/upload_dataset', { method: 'POST', body: fd });
    Object.assign(S, { filename: f.name, msgs: [], ml: null }); save();
    const rows = parseCSV(await f.text());
    st.innerHTML = `<span class="ok">Uploaded ${esc(f.name)}.</span>`;
    $('#prev').innerHTML = rows.length ? `<div class="tbl"><table><thead><tr>${rows[0].map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted">Showing the first ${rows.length - 1} rows of ${rows[0].length} columns.</p>` : '';
    $('#start').disabled = false;
  } catch (e) { st.innerHTML = `<div class="msg bad">Upload failed. ${esc(e.message)}</div>`; }
}

/* ---------- Analyze ---------- */
function analyze() {
  main.innerHTML = `<section class="card narrow"><h1>Analyzing ${esc(S.filename)}</h1>
    <p class="muted">This can take a minute or two. Keep this tab open.</p>
    <ol class="stages"><li id="st1"><i></i><div><b>Analyzing your dataset and generating visualizations</b><small></small></div></li>
    <li id="st2"><i></i><div><b>Cleaning the Data</b><small></small></div></li></ol><div id="aerr"></div></section>`;
  runAnalysis();
}
const mark = (n, state, text) => { const li = $('#st' + n); if (li) { li.className = state; li.querySelector('small').textContent = text || ''; } };
async function runAnalysis() {
  $('#aerr').innerHTML = ''; let n = 1, t0 = Date.now();
  clearInterval(timer);
  timer = setInterval(() => mark(n, 'run', `Running, ${Math.round((Date.now() - t0) / 1000)}s`), 1000);
  try {
    for (const [i, path, k] of [[1, '/run_visuals', 'v'], [2, '/run_cleaning', 'c']]) {
      n = i; t0 = Date.now(); mark(i, 'run', 'Running');
      const r = await post(path, { filename: S.filename });
      Object.assign(S, { [k + 'code']: r.code, [k + 'plan']: r.plan, [k + 'ok']: r.ok, [k + 'err']: r.stderr });
      if (k === 'v') S.profile = r.profile;
      save(); mark(i, 'done', 'Done');
    }
    clearInterval(timer); go('explore');
  } catch (e) {
    clearInterval(timer); mark(n, 'fail', 'Failed');
    const err = $('#aerr'); if (!err) return;
    err.innerHTML = `<div class="msg bad"><b>${n === 1 ? 'Chart generation' : 'Data cleaning'} failed.</b> ${esc(e.message)}</div><button class="btn" id="retry">Retry</button>`;
    $('#retry').onclick = runAnalysis;
  }
}

/* ---------- Explore ---------- */
let imgs = [], cur = 0, sending = false;
function explore() {
  const bad = S.vok === false || S.cok === false;
  main.innerHTML = `${bad ? `<div class="msg warn"><b>A generated script failed in the sandbox,</b> so some charts or the cleaned dataset may be missing.<details><summary>Show error output</summary><pre>${esc([S.verr, S.cerr].filter(Boolean).join('\n\n'))}</pre></details></div>` : ''}
  <div class="grid">
    <section class="card"><div class="head"><h2>Charts</h2><span id="count" class="muted"></span></div>
      <figure id="fig"></figure>
      <div class="pager"><button class="btn ghost" id="pv">Previous</button><button class="btn ghost" id="nx">Next</button></div><div id="thumbs"></div></section>
    <section class="card"><div class="head"><h2>Ask the copilot</h2><button class="link" id="clr">Clear chat</button></div>
      <div id="log" aria-live="polite"></div>
      <form id="cf"><textarea id="ci" rows="2" aria-label="Message" placeholder="Ask about your data or request a new chart"></textarea><button class="btn" id="send">Send</button></form></section>
  </div>
  <section class="card"><div class="tabs" role="tablist"><button role="tab" data-t="plans" aria-selected="true">Agent steps</button><button role="tab" data-t="code" aria-selected="false">Generated code</button></div><div id="tab"></div></section>
  <p><button class="btn" id="tomodel">Build and train a model</button></p>`;
  $('#pv').onclick = () => { cur--; paintFig(); };
  $('#nx').onclick = () => { cur++; paintFig(); };
  $('#clr').onclick = () => { S.msgs = []; save(); paintLog(); };
  $('#tomodel').onclick = () => go('model');
  $('#cf').onsubmit = e => { e.preventDefault(); const t = $('#ci').value.trim(); if (t && !sending) { $('#ci').value = ''; send(t); } };
  $('#ci').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cf').requestSubmit(); } };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => paintTab(b.dataset.t));
  paintLog(); paintTab('plans'); loadImages();
}
function paintTab(t) {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
  const cls = t === 'plans' ? 'txt' : 'code', [a, b] = t === 'plans' ? [S.vplan, S.cplan] : [S.vcode, S.ccode];
  $('#tab').innerHTML = `<div class="two"><div><h3>Visualization ${t === 'plans' ? 'plan' : 'code'}</h3><pre class="${cls}">${esc(a)}</pre></div><div><h3>Cleaning ${t === 'plans' ? 'plan' : 'code'}</h3><pre class="${cls}">${esc(b)}</pre></div></div>`;
}
async function loadImages() {
  try {
    const keep = imgs[cur]; imgs = (await api('/images')).images; bust = Date.now();
    cur = Math.max(0, imgs.indexOf(keep)); paintFig();
  } catch (e) { alertMsg(e.message); }
}
function paintFig() {
  const fig = $('#fig'); if (!fig) return;
  if (!imgs.length) { fig.innerHTML = '<div class="empty">No charts found in the outputs folder.</div>'; $('#count').textContent = ''; $('#thumbs').innerHTML = ''; return; }
  cur = (cur + imgs.length) % imgs.length;
  fig.innerHTML = `<img alt="${esc(imgs[cur])}" src="${imgUrl(imgs[cur])}"><figcaption>${esc(imgs[cur])}</figcaption>`;
  $('#count').textContent = `${cur + 1} of ${imgs.length}`;
  $('#thumbs').innerHTML = imgs.map((m, i) => `<button class="th${i === cur ? ' on' : ''}" data-i="${i}" aria-label="Show ${esc(m)}"><img loading="lazy" alt="" src="${imgUrl(m)}"></button>`).join('');
  document.querySelectorAll('.th').forEach(b => b.onclick = () => { cur = +b.dataset.i; paintFig(); });
}
function paintLog(busy) {
  const l = $('#log'); if (!l) return;
  l.innerHTML = (S.msgs.length || busy ? '' : '<p class="muted">Ask about the dataset, the cleaning steps, or request a new chart.</p>')
    + S.msgs.map(m => `<div class="m ${m.role}">${md(m.content)}</div>`).join('') + (busy ? '<div class="m assistant muted">Thinking…</div>' : '');
  l.scrollTop = l.scrollHeight;
}
async function send(text) {
  sending = true; $('#send').disabled = true;
  S.msgs.push({ role: 'user', content: text }); paintLog(true);
  let reply;
  try {
    reply = flat((await post('/chat', { prompt: text, raw_profile: S.profile || '', cleaning_plan: S.cplan || '', visual_plan: S.vplan || '', cleaning_code: S.ccode || '', visual_code: S.vcode || '' }, 120000)).reply);
  } catch (e) { reply = e.status ? `Agent is unavailable (status ${e.status}).` : `Agent is unavailable. ${e.message}`; }
  S.msgs.push({ role: 'assistant', content: reply }); save();
  sending = false; const b = $('#send'); if (b) b.disabled = false;
  paintLog(); loadImages();
}

/* ---------- Model ---------- */
function model() {
  main.innerHTML = `<section class="card"><h1>Train a model</h1>
    <p class="muted">The pipeline splits <code>dataset/${esc(S.filename)}</code>, preprocesses it, selects and trains a model, and evaluates it.</p>
    <p><button class="btn" id="run">Run pipeline</button> <button class="btn ghost" id="back">Back to exploration</button></p>
    <div id="mst" role="status"></div><div id="res"></div></section><div id="ev"></div>`;
  $('#back').onclick = () => go('explore'); $('#run').onclick = runML;
  if (S.ml) showML(S.ml);
  loadEval();
}
async function runML() {
  const b = $('#run'), t0 = Date.now(); b.disabled = true;
  $('#mst').textContent = 'Running the pipeline…';
  timer = setInterval(() => { const s = $('#mst'); if (s) s.textContent = `Running the pipeline, ${Math.round((Date.now() - t0) / 1000)}s. Keep this tab open.`; }, 1000);
  try {
    S.ml = await post('/ml-pipeline', { dataset_path: 'dataset/' + S.filename }); save();
    $('#mst').innerHTML = '<span class="ok">Pipeline finished.</span>'; showML(S.ml); loadEval();
  } catch (e) { if ($('#mst')) $('#mst').innerHTML = `<div class="msg bad"><b>The pipeline failed.</b> ${esc(e.message)}</div>`; }
  finally { clearInterval(timer); if ($('#run')) $('#run').disabled = false; }
}
function showML(m) {
  const shape = a => Array.isArray(a) ? `${a[0]} rows, ${a[1]} columns` : esc(a);
  const num = v => typeof v === 'number' ? String(+v.toFixed(4)) : esc(v);
  const kv = [['Model', esc(m.model)], ['Task', esc(m.task_type)], ['Target column', esc(m.target_column)], [esc(m.metric || 'Metric'), num(m.metric_value)]];
  if (String(m.task_type).toLowerCase() === 'regression') kv.push(['R²', num(m.r2)]);
  kv.push(['Training set', shape(m.train_shape)], ['Test set', shape(m.test_shape)]);
  $('#res').innerHTML = `<dl class="kv">${kv.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`
    + (m.report ? `<h3>Classification report</h3><pre class="txt">${esc(m.report)}</pre>` : '')
    + (m.pre_process ? `<h3>Preprocessing</h3><pre class="txt">${esc(m.pre_process)}</pre>` : '');
}
async function loadEval() {
  try {
    const { images } = await api('/images?sub=evaluation'), e = $('#ev'); bust = Date.now(); if (!e) return;
    e.innerHTML = images.length ? `<section class="card"><h2>Evaluation</h2><div class="evgrid">${images.map(n => `<figure><img alt="${esc(n)}" src="${imgUrl(n, 'evaluation')}"><figcaption>${esc(n)}</figcaption></figure>`).join('')}</div></section>` : '';
  } catch (e) { alertMsg(e.message); }
}

/* ---------- Start ---------- */
$('#reset').onclick = async () => {
  if (!confirm('Clear this session and start with a new dataset? Generated files in outputs/ will be deleted.')) return;
  sessionStorage.removeItem('mlc'); S = { step: 'upload', msgs: [] }; save(); imgs = [];
  try { await api('/'); alertMsg(''); } catch (e) { alertMsg(e.message); }
  render();
};
(async () => {
  if (!S) {
    S = { step: 'upload', msgs: [] }; save();
    try { await api('/'); } catch (e) { alertMsg(e.message); }  // your "/" endpoint initializes the folders
  }
  render();
})();
</script>
